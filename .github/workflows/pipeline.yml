# Every five minutes: re-read the trail addresses that moved, judge the new ones, publish the API
# and deploy the site. Trail state (a SQLite file and a price cache) travels between runs in the
# Actions cache. The web app comes from the `site` release, written by the web workflow.
#
# Two jobs. `generate` runs the tracer, which parses data from third-party APIs, with a token that
# cannot deploy. `deploy` holds the Pages and OIDC permissions and runs nothing but GitHub's deploy
# action, on the artifact that `generate` verified.
#
# Every third-party action is pinned to a commit, not a tag: the Binance breach began with a
# tampered package, and a tag can be moved to point at different code.
name: Live pipeline

on:
  schedule:
    # Off the round minutes, which GitHub's scheduler serves last under load.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      cold_start:
        description: "No verified state exists: rebuild the trail from the seeds (deploys stay refused until it is back to size, unless allow_shrink)"
        type: boolean
        default: false
      allow_shrink:
        description: "Deploy even if the trail would shrink by more than a fifth against the live site"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write  # to delete superseded state caches and keep the cadence
      attestations: read
    env:
      GOLDENHOUR_STATE: state
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra ml

      - name: Restore trail state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Bootstrap the state if the cache was empty
        env:
          GH_TOKEN: ${{ github.token }}
          GOLDENHOUR_ALLOW_COLD_START: ${{ inputs.cold_start && '1' || '' }}
        run: scripts/bootstrap-state.sh

      - name: Find the current web build
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-keys.sh

      - name: Restore web build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: web-build
          key: web-${{ steps.keys.outputs.web || 'none' }}

      - name: Download the web build if the cache did not have it
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_ASSET: ${{ steps.keys.outputs.web_asset }}
        run: scripts/fetch-releases.sh

      - name: Follow the money
        # The tracer stops itself at its budget; this is the backstop. What it stored is kept, and
        # the run publishes and deploys what it has.
        timeout-minutes: 8
        continue-on-error: true
        run: uv run goldenhour trace --live --budget 240 --max-judge 200

      - name: Publish the API
        run: uv run goldenhour publish --out site/api/v1

      - name: Verify the site before it can be deployed
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: uv run goldenhour verify-site site $ALLOW_SHRINK

      - name: Save trail state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Delete superseded trail state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site

      - name: Keep the cadence, whatever the scheduler does
        if: always()
        continue-on-error: true  # never the reason a verified site is not deployed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub's cron scheduler can be hours late or silent, especially for a five-minute
          # schedule. So every run, scheduled or not, starts the next one unless another is already
          # queued or running, paced to about five minutes. The cron schedule then only restarts
          # the chain if it ever breaks. The daily deep pass is started here too when it is overdue.
          others="$(gh run list --workflow pipeline.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID}) | select(.status != \"completed\")] | length")"
          # The daily pass is due when none ran yet, when the last one finished more than 25 hours
          # ago, or when the last one failed more than 3 hours ago. One that is running is left be.
          read -r d_status d_conclusion d_created <<<"$(gh run list --workflow daily.yml --limit 1 \
            --json status,conclusion,createdAt --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "none") \(.createdAt // "")"')"
          now=$(date -u +%s)
          age=$(( now - $(date -u -d "${d_created:-@0}" +%s) ))
          if [ "$d_status" = "none" ] \
            || { [ "$d_status" = "completed" ] && [ "$age" -gt 90000 ]; } \
            || { [ "$d_status" = "completed" ] && [ "$d_conclusion" != "success" ] && [ "$age" -gt 10800 ]; }; then
            gh workflow run daily.yml && echo "started the daily deep pass"
          fi
          # The weekly README refresh, which is also the activity that keeps scheduled workflows on.
          last_readme="$(gh run list --workflow readme.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')"
          if [ -z "$last_readme" ] || [ $(( now - $(date -u -d "$last_readme" +%s) )) -gt 604800 ]; then
            if [ "$(gh run list --workflow readme.yml --limit 1 --json status --jq '.[0].status // "none"')" != "in_progress" ]; then
              gh workflow run readme.yml && echo "started the README refresh"
            fi
          fi
          if [ "${others:-0}" -gt 0 ]; then
            echo "another run is queued or running; nothing to do"
            exit 0
          fi
          started="$(gh run view "$GITHUB_RUN_ID" --json startedAt --jq .startedAt)"
          spent=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          if [ "$spent" -lt 270 ]; then sleep $(( 270 - spent )); fi
          gh workflow run pipeline.yml

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
      actions: read  # to find this run's github-pages artifact
      contents: write  # to create the commit object that names the deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploys this run's github-pages artifact through the Pages API. Pages names a deployment
          # by its build version and keeps serving the old files when a deployment reuses one, and
          # actions/deploy-pages always uses the bare commit, so between commits the site stopped
          # changing. Each run deploys under its own version. Refusals (an earlier deployment still
          # finishing) are retried; the step ends when Pages reports the deployment live.
          set -euo pipefail
          # The build version has to be a commit of this repository, so each run makes one: the same
          # tree as the deployed commit, on no branch, never part of the history.
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          BUILD_VERSION="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" -f tree="$tree" -f "parents[]=$GITHUB_SHA" \
            -f message="Pages deployment for run $GITHUB_RUN_ID" -f "author[name]=Dharmesh Meena" \
            -f "author[email]=176051217+dharmeshdev1@users.noreply.github.com" --jq .sha)"
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)"
          echo "::add-mask::$oidc"
          for attempt in 1 2 3 4 5; do
            if out="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" -F artifact_id="$artifact" \
                -f pages_build_version="$BUILD_VERSION" -f oidc_token="$oidc" 2>&1)"; then
              break
            fi
            echo "attempt $attempt refused: $out"
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 45
          done
          id="$(jq -r '.id // (.status_url | split("/") | last)' <<<"$out")"
          echo "page_url=$(jq -r '.page_url // ""' <<<"$out")" >> "$GITHUB_OUTPUT"
          status=unknown
          for _ in $(seq 1 120); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status)"
            case "$status" in
              succeed) echo "deployed $BUILD_VERSION"; exit 0 ;;
              *failed*|*cancelled*|*lost*|*error*) echo "::error::Pages deployment $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Pages deployment still $status after ten minutes"
          exit 1
