# Build the web app for GitHub Pages and hand it to the live pipeline through the `site` release.
# The build runs third-party packages, so it gets a read-only token; a separate job with write
# access signs the result (build provenance) and publishes it, without running any of that code.
name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions: {}  # each job asks for exactly what it needs

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /goldenhour
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -s out/index.html && test -s out/api/index.html
          # The live pipeline publishes the data under api/v1; the API docs page at api/ stays.
          rm -rf out/api/v1
          echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)" > out/BUILD
          tar -czf ../web.tar.gz -C out .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: web
          path: web.tar.gz
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: web
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: web.tar.gz
      - name: Publish to the site release
        run: |
          if ! gh release view site >/dev/null 2>&1; then
            gh release create site --prerelease --title "Web build" \
              --notes "The built web app. The live pipeline deploys it to GitHub Pages together with fresh data."
          fi
          gh release upload site web.tar.gz --clobber
      - name: Deploy now
        run: gh workflow run pipeline.yml
