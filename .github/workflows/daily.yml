# Once a day: a long trace pass that re-reads every trail address holding value, then a signed
# snapshot of the trail state. The snapshot is what a cold live pipeline starts from, and anyone can
# download it, verify where it was built (`gh attestation verify`) and reproduce every number.
#
# The trace job reads third-party data with a read-only token; a separate job with write access
# signs and publishes the snapshot without running any of that code.
name: Daily

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}  # each job asks for exactly what it needs

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GOLDENHOUR_STATE: state
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra ml
      - name: Restore trail state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: state
          key: state-daily-${{ github.run_id }}
          restore-keys: state-
      - name: Bootstrap the state if the cache was empty
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/bootstrap-state.sh
      - name: Long pass
        run: uv run goldenhour trace --live --budget 3600 --max-judge 1000
      - name: Save trail state for the live pipeline
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: state
          key: state-daily-${{ github.run_id }}
      - name: Snapshot
        run: |
          stamp="$(date -u +%Y%m%d)"
          tar -czf "state-${stamp}.tar.gz" -C state .
          cp "state-${stamp}.tar.gz" state.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: state
          path: state*.tar.gz
          retention-days: 3

  publish:
    needs: deep
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: state
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: state*.tar.gz
      - name: Publish to the state release
        run: |
          if ! gh release view state >/dev/null 2>&1; then
            gh release create state --prerelease --title "Trail state" \
              --notes "Daily signed snapshot of the trail database. Verify with: gh attestation verify state.tar.gz --repo ${GH_REPO} --signer-workflow ${GH_REPO}/.github/workflows/daily.yml --source-ref refs/heads/main"
          fi
          gh release upload state state*.tar.gz --clobber
          # Keep the last seven dated snapshots.
          gh release view state --json assets --jq '.assets[].name' | grep -E '^state-[0-9]{8}\.tar\.gz$' | sort -r \
            | tail -n +8 | xargs -r -n1 gh release delete-asset state -y || true
