id: binance-2026-10
title: "Binance, 29 October 2026"
victim: Binance
attribution: "TraderTraitor (North Korea), per the FBI alert of 31 October 2026"

# The theft ran from 20:05 to 23:56 UTC on 29 October. The window opens an hour early so that
# preparation (test transfers, the EIP-7702 delegations) is inside it, and closes when Binance
# revoked the delegations at 00:10 UTC on 30 October.
window:
  start: 2026-10-29T19:00:00Z
  end: 2026-10-30T00:10:00Z

seed_files:
  - seeds-fbi-2026-10-31.txt

