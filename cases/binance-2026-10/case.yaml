  chains: 11

timeline:
  - at: "2026-06"
    what: "A Wallet DevOps engineer installs a tampered Homebrew package, found through a search ad while looking for an AI coding tool."
    source: binance-report
  - at: "2026-09"
    what: "A second engineer runs an interview 'assignment' from a fake recruiter. It replaces pyenv in the Homebrew directory with a backdoor."
    source: binance-report
  - at: "2026-10-20"
    what: "Through the second engineer's machine and an internal AI tool, the attacker takes over two more engineers' computers and finds a token with container deployment rights."
    source: binance-report
  - at: "2026-10-29T13:51:35Z"
    what: "Rehearsal. The attacker's executor account delegates two of its own test wallets with EIP-7702."
    source: chain
    tx: "0x16b5acc35a82d194aadb21a4a56d666310fe83982c387c974f4796275f499dca"
  - at: "2026-10-29T15:59:11Z"
    what: "The executor deploys the sweeper contract that Binance 14 will later be delegated to."
    source: chain
    tx: "0x97408e7562eb2b28efcd24ba01609607b5749bc89448d007fa8b50ecf290329c"
  - at: "2026-10-29T16:20:47Z"
    what: "Second rehearsal: a test wallet is delegated to the same sweeper contract, twice."
    source: chain
    tx: "0xb2148eb825cac75efe0ae7fb5c319e6b66df62631738ba252185960e50dc5782"
  - at: "2026-10-29"
    what: "Hours before the drain, a container deployed with stolen credentials reaches the wallet signing service. It signs what the attacker asks, including 50 EIP-7702 delegations."
    source: tangem
  - at: "2026-10-29T20:05:00Z"
    what: "The drain begins on the XRP Ledger: 233.46 million XRP leave five hot wallets in four minutes."
    source: tangem
  - at: "2026-10-29T20:10:18Z"
    what: "Solana: 970,521.9 SOL leave a Binance wallet for one address, in five transfers."
    source: chain
  - at: "2026-10-29T20:20:00Z"
    what: "Tron: 10,000 TRX leave a Binance wallet for one address, a test; 46.4 million TRX follow at 20:21:12 and 612.7 million USDT at 20:22:45."
    source: chain
  - at: "2026-10-29T20:20:06Z"
    what: "Bitcoin: 18,270.2 BTC leave a Binance wallet for one address, which splits it into the 19 FBI-listed addresses in the same block."
    source: chain
  - at: "2026-10-29T20:20:59Z"
    what: "One transaction installs the delegation on Binance 14: 50 EIP-7702 authorizations, all signed for that wallet, for 50 consecutive nonces, so one would be valid whenever it landed. Nonce 18,914,809 was. From here, the attacker's contract runs as the wallet's own code."
    source: chain
    tx: "0xad99264d5532ae0dd04b2004eebda05f25657e70dacb764f7ac8d4ccd051298b"
  - at: "2026-10-29T20:41:23Z"
    what: "823 million USDC leave a second Binance wallet in a call made to Binance 14: the delegated code spends an allowance that wallet had granted Binance 14. Once a hot wallet runs attacker code, every approval granted to it is a way out."
    source: chain
    tx: "0xdc102dd89dded5a83f1008906883ffb7c81ff3b7d7965d8c7277d170b5e17481"
  - at: "2026-10-29T21:01:35Z"
    what: "Tether freezes the first trail addresses on Ethereum, 37 minutes after the stolen USDT arrived. 434 million USDT had already been swapped for ETH."
    source: elliptic
  - at: "2026-10-29T23:56:00Z"
    what: "The last transfer, 2,961.9 ETH. The delegations had kept working after withdrawals were suspended."
    source: thoropass
  - at: "2026-10-30T00:10:00Z"
    what: "Binance revokes the EIP-7702 delegations."
    source: thoropass
  - at: "2026-10-31"
    what: "The FBI attributes the theft to TraderTraitor and publishes 628 addresses."
    source: fbi

